<div>
    <ul id="wallets">
        @for (wallet of wallets(); track wallet.id) {
            <li><app-wallet [wallet]="wallet" (selectedWalletId)="onSelectedWalletId($event)"/></li>
        } @empty {
            <p>No data found!</p>
        }
    </ul>
</div>
