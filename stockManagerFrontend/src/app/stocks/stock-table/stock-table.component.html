<!--<app-add-stock-to-wallet [ticker]="stock().ticker"></app-add-stock-to-wallet>-->

<div class="text-button-container">
    <p><strong>Financial Indicators:</strong></p>
    <button class="add-button" [routerLink]="['/stocks/add',stock().ticker]">+</button>
</div>
<table class="info-table">
    <thead>
        <tr>
        <th>ROE</th>
        <th>ROIC</th>
        <th>EBIT</th>
        <th>EV/EBIT</th>
        <th>LPA</th>
        <th>Price</th>
        <th>ROIC Rank</th>
        <th>EY Rank</th>
        <th>Final Rank</th>
        <th>Index</th>
        </tr>
    </thead>
    <tbody>
        <tr>
        <td>{{stock().roe}}</td>
        <td>{{stock().roic}}</td>
        <td>{{stock().margemEbit}}</td>
        <td>{{stock().evEbit}}</td>
        <td>{{stock().lpa}}</td>
        <td>R${{stock().price}}</td>
        <td>{{stock().roicRank}}°</td>
        <td>{{stock().eyRank}}°</td>
        <td>{{stock().finalRank}}°</td>
        <td>{{stock().index}}°</td>
        </tr>
    </tbody>
</table>
